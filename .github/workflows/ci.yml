name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, tipagem e testes (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Mypy
        run: mypy simulator source_systems scripts

      - name: Pytest
        run: pytest --cov=simulator --cov=source_systems --cov-report=term-missing

  containers:
    name: Compose e imagem das APIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # valores aleatórios, só para o job
      - name: Gerar .env de CI
        run: python scripts/init_env.py

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Construir imagem das APIs simuladas
        run: docker compose build b2b-store

      - name: Verificar finais de linha dos scripts do banco (LF)
        run: |
          if grep -rlI $'\r' database; then
            echo "Arquivos com CRLF quebram o sqlplus/bash dentro do container" && exit 1
          fi
